<!-- contact.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact Us - Sweet Treats Bakery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Contact Sweet Treats</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Get in Touch</h2>
      <form action="form-handler.php" method="POST">
        <label for="name">Name:</label><br>
        <input type="text" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea name="message" rows="5" required></textarea><br><br>

        <input type="submit" value="Send Message">
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 Sweet Treats Bakery</p>
  </footer>
  <!-- Dark Mode Toggle Button -->
<button class="dark-mode-toggle" id="darkModeToggle">🌙 Dark Mode</button>
<script>
  // Dark Mode Toggle
  const darkModeToggle = document.getElementById('darkModeToggle');

  darkModeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      darkModeToggle.textContent = '🌞 Light Mode'; // Change button text to "Light Mode"
    } else {
      darkModeToggle.textContent = '🌙 Dark Mode'; // Change button text to "Dark Mode"
    }
  });

  // Loader Animation
  window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    loader.style.display = 'none'; // Hide loader once the page content is loaded
  });
</script>

</body>
</html>
