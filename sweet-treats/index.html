<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sweet Treats Bakery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loader -->
<div id="loader">
  <div class="spinner"></div>
</div>

  <header>
    <h1>Sweet Treats Bakery</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Delicious Treats, Fresh Daily 🍰</h2>
      <p>We bake with love and serve with a smile!</p>
    </section>
  </main>

  <footer>
    <p>© 2025 Sweet Treats Bakery</p>
  </footer>
  <!-- Dark Mode Toggle Button -->
<button class="dark-mode-toggle" id="darkModeToggle">🌙 Dark Mode</button>
<script>
  // Dark Mode Toggle
  const darkModeToggle = document.getElementById('darkModeToggle');

  darkModeToggle.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
    if (document.body.classList.contains('dark-mode')) {
      darkModeToggle.textContent = '🌞 Light Mode'; // Change button text to "Light Mode"
    } else {
      darkModeToggle.textContent = '🌙 Dark Mode'; // Change button text to "Dark Mode"
    }
  });

  // Loader Animation
  window.addEventListener('load', () => {
    const loader = document.getElementById('loader');
    loader.style.display = 'none'; // Hide loader once the page content is loaded
  });
</script>

</body>
</html>
